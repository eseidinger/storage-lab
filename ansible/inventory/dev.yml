all:
  children:
    storage_lab:
      hosts:
        dev-vm:
          storage_lab_oidc_issuer: https://identity.eseidinger.de/realms/platform
          storage_lab_oidc_jwks_url: https://identity.eseidinger.de/realms/platform/protocol/openid-connect/certs
          storage_lab_oidc_audience: storage-lab-api
          storage_lab_oidc_client_id: storage-lab-portal
          ansible_host: 127.0.0.1
          ansible_port: 2222
          ansible_user: lab
          ansible_ssh_private_key_file: "{{ inventory_dir }}/../../.local/dev-vm/id_ed25519"
          ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile={{ inventory_dir }}/../../.local/dev-vm/known_hosts"
