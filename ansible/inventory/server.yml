all:
  children:
    storage_lab:
      hosts:
        storage-lab.eseidinger.de:
          ansible_user: root
          ansible_port: 22
          ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/eseidinger_rsa"
          ansible_ssh_common_args: "-o StrictHostKeyChecking=yes -o UserKnownHostsFile={{ inventory_dir }}/../../.local/server/known_hosts"
          storage_lab_portal_host: storage-lab.eseidinger.de
          storage_lab_s3_host: storage-lab.eseidinger.de
          storage_lab_clickhouse_host: storage-lab.eseidinger.de
          storage_lab_qdrant_host: storage-lab.eseidinger.de
          storage_lab_postgres_host: storage-lab.eseidinger.de
          storage_lab_valkey_host: storage-lab.eseidinger.de
          storage_lab_nats_host: storage-lab.eseidinger.de
          storage_lab_opensearch_host: storage-lab.eseidinger.de
          storage_lab_dev_gateways_bind: 127.0.0.1
          storage_lab_secret_namespace: server-deploy
          storage_lab_hugegraph_host: storage-lab.eseidinger.de
          storage_lab_oidc_issuer: https://identity.eseidinger.de/realms/platform
          storage_lab_oidc_jwks_url: https://identity.eseidinger.de/realms/platform/protocol/openid-connect/certs
          storage_lab_oidc_audience: storage-lab-api
          storage_lab_oidc_client_id: storage-lab-portal
