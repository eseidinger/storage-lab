---
- name: Prepare the Storage Lab host for Docker Compose
  hosts: storage_lab
  become: true
  tasks:
    - name: Remove Docker packages that conflict with the official repository
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose
          - docker-compose-v2
          - docker-doc
          - docker-buildx
          - podman-docker
          - containerd
          - runc
        state: absent

    - name: Install prerequisites for Docker's APT repository
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - openssl
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create APT keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker's APT signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Configure Docker's official APT repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_facts['distribution_release'] }}
          Components: stable
          Signed-By: /etc/apt/keyrings/docker.asc
        mode: '0644'
      register: docker_repository

    - name: Install Docker Engine and Compose from Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
        cache_valid_time: "{{ 0 if docker_repository.changed else 3600 }}"

    - name: Start Docker Engine
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create deployment directory
      ansible.builtin.file:
        path: /opt/storage-lab
        state: directory
        owner: root
        group: root
        mode: '0755'
