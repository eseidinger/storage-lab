---
- name: Prepare the Storage Lab development guest for Docker Compose
  hosts: storage_lab
  become: true
  tasks:
    - name: Install Docker Engine and Compose from Ubuntu packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - docker.io
          - docker-compose-v2
          - openssl
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Start Docker Engine
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create deployment directory
      ansible.builtin.file:
        path: /opt/storage-lab
        state: directory
        owner: root
        group: root
        mode: '0755'
