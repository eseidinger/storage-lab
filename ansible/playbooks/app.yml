---
- name: Remove the previous host and Podman deployment
  hosts: storage_lab
  become: true
  tasks:
    - name: Inspect previous Storage Lab systemd units
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ item }}.service"
      loop:
        - storage-lab-api
        - storage-lab-worker
        - storage-lab-rustfs
        - storage-lab-couchdb
        - storage-lab-keycloak
        - storage-lab-app
        - storage-lab-caddy
      register: old_units

    - name: Stop previous Storage Lab systemd units
      ansible.builtin.systemd_service:
        name: "{{ item.item }}"
        state: stopped
        enabled: false
      loop: "{{ old_units.results }}"
      when: item.stat.exists

    - name: Remove previous Storage Lab systemd units
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item.item }}.service"
        state: absent
      loop: "{{ old_units.results }}"
      when: item.stat.exists

    - name: Reload systemd after removing previous units
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Check for previous Podman installation
      ansible.builtin.stat:
        path: /usr/bin/podman
      register: old_podman

    - name: Remove previous Podman containers
      ansible.builtin.command:
        argv: [podman, rm, -f, "{{ item }}"]
      loop:
        - storage-lab-api
        - storage-lab-app
        - storage-lab-caddy
        - storage-lab-rustfs
        - storage-lab-couchdb
        - storage-lab-keycloak
      when: old_podman.stat.exists
      failed_when: false

    - name: Remove previous Podman volumes
      ansible.builtin.command:
        argv: [podman, volume, rm, -f, "{{ item }}"]
      loop:
        - rustfs-data
        - couchdb-data
        - storage-lab-keycloak-data
        - storage-lab-caddy-data
      when: old_podman.stat.exists
      failed_when: false

    - name: Remove previous Podman and host PostgreSQL packages
      ansible.builtin.apt:
        name:
          - podman
          - postgresql
          - postgresql-16
          - postgresql-client
          - postgresql-client-16
        state: absent
        purge: true

    - name: Remove previous host application files and local Keycloak import
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/storage-lab/backend
        - /opt/storage-lab/venv
        - /opt/storage-lab/keycloak-import
        - /etc/storage-lab
        - /etc/ssl/private/storage-lab-pg.key
        - /etc/ssl/certs/storage-lab-pg.crt

- import_playbook: deploy.yml

- name: Deploy Storage Lab through Docker Compose
  hosts: storage_lab
  become: true
  vars:
    source_root: "{{ playbook_dir }}/../.."
    secret_dir: "{{ source_root }}/.local/deploy"
    metadata_pg_password: "{{ lookup('password', secret_dir ~ '/metadata-pg-password length=32 chars=ascii_letters,digits') }}"
    api_db_password: "{{ lookup('password', secret_dir ~ '/api-db-password length=32 chars=ascii_letters,digits') }}"
    worker_db_password: "{{ lookup('password', secret_dir ~ '/worker-db-password length=32 chars=ascii_letters,digits') }}"
    app_pg_password: "{{ lookup('password', secret_dir ~ '/app-pg-password length=32 chars=ascii_letters,digits') }}"
    rustfs_access_key: "{{ lookup('password', secret_dir ~ '/rustfs-access-key length=24 chars=ascii_letters,digits') }}"
    rustfs_secret_key: "{{ lookup('password', secret_dir ~ '/rustfs-secret-key length=48 chars=ascii_letters,digits') }}"
    couchdb_admin_password: "{{ lookup('password', secret_dir ~ '/couchdb-admin-password length=40 chars=ascii_letters,digits') }}"
    valkey_admin_password: "{{ lookup('password', secret_dir ~ '/valkey-admin-password length=40 chars=ascii_letters,digits') }}"
    clickhouse_admin_password: "{{ lookup('password', secret_dir ~ '/clickhouse-admin-password length=40 chars=ascii_letters,digits') }}"
    qdrant_api_key: "{{ lookup('password', secret_dir ~ '/qdrant-api-key length=64 chars=ascii_letters,digits') }}"
    opensearch_admin_password: "A!a1{{ lookup('password', secret_dir ~ '/opensearch-admin-password length=40 chars=ascii_letters,digits') }}"
    hugegraph_admin_password: "{{ lookup('password', secret_dir ~ '/hugegraph-admin-password length=40 chars=ascii_letters,digits') }}"
    credential_key: "{{ lookup('file', secret_dir ~ '/credential-key') | trim }}"
    oidc_issuer: "{{ lookup('env', 'STORAGE_LAB_OIDC_ISSUER') or (storage_lab_oidc_issuer | default('')) }}"
    oidc_audience: "{{ lookup('env', 'STORAGE_LAB_OIDC_AUDIENCE') or (storage_lab_oidc_audience | default('storage-lab-api')) }}"
    oidc_jwks_url: "{{ lookup('env', 'STORAGE_LAB_OIDC_JWKS_URL') or (storage_lab_oidc_jwks_url | default('')) }}"
    oidc_client_id: "{{ lookup('env', 'STORAGE_LAB_OIDC_CLIENT_ID') or (storage_lab_oidc_client_id | default('storage-lab-portal')) }}"
    portal_public_url: "{{ 'https://localhost:8080' if (storage_lab_portal_host | default('localhost')) == 'localhost' else 'https://' ~ storage_lab_portal_host }}"
    s3_public_url: "{{ 'https://localhost:9000' if (storage_lab_s3_host | default('localhost')) == 'localhost' else 'https://' ~ storage_lab_s3_host }}"
    clickhouse_public_url: "{{ 'https://localhost:9001' if (storage_lab_clickhouse_host | default('localhost')) == 'localhost' else 'https://' ~ storage_lab_clickhouse_host }}"
    qdrant_public_url: "{{ 'https://localhost:9003' if (storage_lab_qdrant_host | default('localhost')) == 'localhost' else 'https://' ~ storage_lab_qdrant_host }}"
    portal_gateway_url: "{{ 'https://localhost:443' if (storage_lab_portal_host | default('localhost')) == 'localhost' else 'https://' ~ storage_lab_portal_host }}"
    s3_gateway_url: "{{ 'https://localhost:9443' if (storage_lab_s3_host | default('localhost')) == 'localhost' else 'https://' ~ storage_lab_s3_host }}"
  pre_tasks:
    - name: Require an external OIDC realm
      ansible.builtin.assert:
        that:
          - oidc_issuer | length > 0
          - oidc_jwks_url | length > 0
        fail_msg: Configure STORAGE_LAB_OIDC_ISSUER and STORAGE_LAB_OIDC_JWKS_URL or set the inventory values.

    - name: Create local deployment secret directory
      ansible.builtin.file:
        path: "{{ secret_dir }}"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false

    - name: Create stable credential encryption key
      ansible.builtin.shell: >-
        python3 -c 'import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())'
        > {{ secret_dir }}/credential-key
      args:
        creates: "{{ secret_dir }}/credential-key"
      delegate_to: localhost
      become: false
      no_log: true

  tasks:
    - name: Allow OpenSearch memory mappings
      ansible.builtin.copy:
        content: "vm.max_map_count=262144\n"
        dest: /etc/sysctl.d/99-storage-lab-opensearch.conf
        mode: '0644'
      register: opensearch_sysctl

    - name: Apply OpenSearch memory map limit
      ansible.builtin.command:
        argv: [sysctl, -w, vm.max_map_count=262144]
      when: opensearch_sysctl.changed

    - name: Clear previous image build context
      ansible.builtin.file:
        path: /opt/storage-lab/image
        state: absent

    - name: Create Compose directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - /opt/storage-lab/image
        - /opt/storage-lab/certs
        - /opt/storage-lab/caddy-ca

    - name: Copy Compose deployment files
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "/opt/storage-lab/{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop:
        - { src: '../../deploy/compose.yaml', dest: compose.yaml, mode: '0644' }
        - { src: '../../deploy/metadata-init.sh', dest: metadata-init.sh, mode: '0755' }
        - { src: '../../deploy/app-pg_hba.conf', dest: app-pg_hba.conf, mode: '0644' }
        - { src: '../files/couchdb-single-node.ini', dest: couchdb-single-node.ini, mode: '0644' }

    - name: Configure Compose secrets
      ansible.builtin.template:
        src: ../templates/compose.env.j2
        dest: /opt/storage-lab/.env
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Configure API and worker environments
      ansible.builtin.template:
        src: "../templates/{{ item }}.env.j2"
        dest: "/opt/storage-lab/{{ item }}.env"
        owner: root
        group: root
        mode: '0600'
      loop: [api, worker]
      no_log: true

    - name: Configure Caddy
      ansible.builtin.template:
        src: ../templates/Caddyfile.j2
        dest: /opt/storage-lab/Caddyfile
        mode: '0644'

    - name: Create application PostgreSQL TLS certificate
      ansible.builtin.command:
        argv:
          - openssl
          - req
          - -x509
          - -nodes
          - -newkey
          - rsa:2048
          - -days
          - '365'
          - -keyout
          - /opt/storage-lab/certs/postgres.key
          - -out
          - /opt/storage-lab/certs/postgres.crt
          - -subj
          - /CN=localhost
          - -addext
          - subjectAltName=DNS:localhost,IP:127.0.0.1
        creates: /opt/storage-lab/certs/postgres.key

    - name: Protect application PostgreSQL TLS key
      ansible.builtin.file:
        path: /opt/storage-lab/certs/postgres.key
        owner: root
        group: '999'
        mode: '0640'

    - name: Archive app image sources on the controller
      ansible.builtin.command:
        argv:
          - tar
          - -czf
          - "{{ secret_dir }}/app-build.tar.gz"
          - --exclude=frontend/node_modules
          - --exclude=frontend/dist
          - --exclude=frontend/.env*
          - -C
          - "{{ source_root }}"
          - Dockerfile
          - .dockerignore
          - backend/requirements.txt
          - backend/alembic.ini
          - backend/src
          - backend/migrations
          - backend/scripts
          - frontend
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Copy app image sources to the guest
      ansible.builtin.unarchive:
        src: "{{ secret_dir }}/app-build.tar.gz"
        dest: /opt/storage-lab/image

    - name: Validate Compose configuration
      ansible.builtin.command:
        argv: [docker, compose, -f, /opt/storage-lab/compose.yaml, config, --quiet]
        chdir: /opt/storage-lab
      changed_when: false

    - name: Build app and worker image
      ansible.builtin.command:
        argv: [docker, compose, -f, /opt/storage-lab/compose.yaml, build, app]
        chdir: /opt/storage-lab

    - name: Start data services
      ansible.builtin.command:
        argv: [docker, compose, -f, /opt/storage-lab/compose.yaml, up, -d, --wait, metadata-db, app-postgres, rustfs, couchdb, valkey, clickhouse, qdrant, opensearch, opensearch-dashboards, hugegraph]
        chdir: /opt/storage-lab

    - name: Apply metadata migrations in the app image
      ansible.builtin.command:
        argv: [docker, compose, -f, /opt/storage-lab/compose.yaml, run, --rm, migrate]
        chdir: /opt/storage-lab

    - name: Grant API access to migrated metadata tables
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - /opt/storage-lab/compose.yaml
          - exec
          - -T
          - metadata-db
          - psql
          - -U
          - postgres
          - -d
          - storage_lab
          - -v
          - ON_ERROR_STOP=1
          - -c
          - >-
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO storage_lab_api;
            GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO storage_lab_api;
        chdir: /opt/storage-lab
      no_log: true

    - name: Validate Caddy configuration
      ansible.builtin.command:
        argv: [docker, compose, -f, /opt/storage-lab/compose.yaml, run, --rm, --no-deps, caddy, validate, --config, /etc/caddy/Caddyfile]
        chdir: /opt/storage-lab
      changed_when: false

    - name: Start app, worker, and Caddy
      ansible.builtin.command:
        argv: [docker, compose, -f, /opt/storage-lab/compose.yaml, up, -d, --no-build, --wait, app, worker, caddy]
        chdir: /opt/storage-lab

    - name: Copy Caddy public CA certificate for container checks
      ansible.builtin.command:
        argv: [docker, compose, -f, /opt/storage-lab/compose.yaml, cp, caddy:/data/caddy/pki/authorities/local/root.crt, /opt/storage-lab/caddy-ca/root.crt]
        chdir: /opt/storage-lab
      register: caddy_ca_copy
      until: caddy_ca_copy.rc == 0
      retries: 30
      delay: 2

    - name: Make Caddy public CA certificate readable
      ansible.builtin.file:
        path: /opt/storage-lab/caddy-ca/root.crt
        mode: '0644'

    - name: Verify HTTPS portal and API routes
      ansible.builtin.uri:
        url: "{{ item }}"
        validate_certs: false
        status_code: 200
      loop:
        - "{{ portal_gateway_url }}/api/health"
        - "{{ portal_gateway_url }}/auth/callback"
      register: https_route
      until: https_route.status == 200
      retries: 30
      delay: 2

    - name: Verify administrative gateway routes are blocked
      ansible.builtin.uri:
        url: "{{ item }}"
        validate_certs: false
        status_code: 403
      loop:
        - "{{ portal_gateway_url }}/couchdb/_all_dbs"
        - "{{ s3_gateway_url }}/rustfs/admin/v3/info"
      changed_when: false
