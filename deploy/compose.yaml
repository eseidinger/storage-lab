name: storage-lab

x-app-image: &app-image
  image: storage-lab-app:local
  build:
    context: ./image
    args:
      VITE_API_URL: /api
      VITE_OIDC_AUTHORITY: ${OIDC_ISSUER}
      VITE_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}

services:
  metadata-db:
    image: postgres:18.7-bookworm
    environment:
      POSTGRES_DB: storage_lab
      POSTGRES_PASSWORD: ${META_POSTGRES_PASSWORD}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD}
    volumes:
      - metadata-db-18-data:/var/lib/postgresql
      - ./metadata-init.sh:/docker-entrypoint-initdb.d/10-storage-lab.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d storage_lab"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app-postgres:
    image: postgres:18.7-bookworm
    environment:
      POSTGRES_PASSWORD: ${APP_PG_PASSWORD}
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/postgres.crt
      - -c
      - ssl_key_file=/certs/postgres.key
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - listen_addresses=*
    ports:
      - "5433:5432"
    volumes:
      - app-postgres-18-data:/var/lib/postgresql
      - ./certs/postgres.crt:/certs/postgres.crt:ro
      - ./certs/postgres.key:/certs/postgres.key:ro
      - ./app-pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rustfs:
    image: docker.io/rustfs/rustfs@sha256:b81d16a90ee25bd9511280127ca1471788c6e874cf0f0da759645f46b2dc1d74
    command: [/data]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - rustfs-data:/data
    restart: unless-stopped

  couchdb:
    image: docker.io/apache/couchdb@sha256:691c86227d66e9d6b4dd5b045b41f674c145a1cc70d05cfb1f1c804ad7ff4563
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: ${COUCHDB_ADMIN_PASSWORD}
    volumes:
      - couchdb-data:/opt/couchdb/data
      - ./couchdb-single-node.ini:/opt/couchdb/etc/local.d/10-storage-lab.ini
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9.1.2
    environment:
      VALKEY_ADMIN_PASSWORD: ${VALKEY_ADMIN_PASSWORD}
    command:
      - sh
      - -ec
      - >-
        if [ ! -f /data/users.acl ]; then
          printf 'user default off\nuser admin on >%s ~* &* +@all\n' "$$VALKEY_ADMIN_PASSWORD" > /data/users.acl;
        fi;
        exec valkey-server --appendonly yes --aclfile /data/users.acl
          --tls-port 6380 --port 6379 --tls-auth-clients no
          --tls-cert-file /certs/postgres.crt --tls-key-file /certs/postgres.key
          --tls-ca-cert-file /certs/postgres.crt
    group_add: ["999"]
    ports:
      - "6380:6380"
    volumes:
      - valkey-data:/data
      - ./certs/postgres.crt:/certs/postgres.crt:ro
      - ./certs/postgres.key:/certs/postgres.key:ro
    healthcheck:
      test: [CMD-SHELL, "valkey-cli --user admin -a \"$$VALKEY_ADMIN_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:26.9.27.3
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: [CMD-SHELL, "clickhouse-client --user admin --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.1
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
      QDRANT__SERVICE__JWT_RBAC: "true"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD}
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    restart: unless-stopped

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.9.0
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
      OPENSEARCH_USERNAME: kibanaserver
      OPENSEARCH_PASSWORD: kibanaserver
      OPENSEARCH_SSL_VERIFICATIONMODE: none
    depends_on:
      opensearch:
        condition: service_started
    restart: unless-stopped

  hugegraph:
    image: hugegraph/hugegraph:1.7.0
    environment:
      PASSWORD: ${HUGEGRAPH_ADMIN_PASSWORD}
    volumes:
      - hugegraph-data:/hugegraph-server
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:8080/versions >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  nats-init:
    <<: *app-image
    profiles: [tools]
    env_file: ./worker.env
    command: [python, -m, storage_lab.nats_adapter]
    volumes:
      - ./nats-config:/nats-config

  nats:
    image: nats:2.14.10-alpine
    command: [-c, /etc/nats/nats.conf]
    ports:
      - "4222:4222"
    group_add: ["999"]
    volumes:
      - ./nats-config:/etc/nats:ro
      - nats-data:/data
      - ./certs/postgres.crt:/certs/postgres.crt:ro
      - ./certs/postgres.key:/certs/postgres.key:ro
    restart: unless-stopped

  migrate:
    <<: *app-image
    profiles: [tools]
    env_file: ./worker.env
    environment:
      STORAGE_LAB_UI_DIST: ""
    command: [alembic, -c, /app/alembic.ini, upgrade, head]
    depends_on:
      metadata-db:
        condition: service_healthy

  app:
    <<: *app-image
    env_file: ./api.env
    depends_on:
      metadata-db:
        condition: service_healthy
      rustfs:
        condition: service_started
      couchdb:
        condition: service_started
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    <<: *app-image
    env_file: ./worker.env
    environment:
      STORAGE_LAB_UI_DIST: ""
    command: [python, -m, storage_lab.worker]
    volumes:
      - ./caddy-ca:/caddy-ca:ro
      - ./certs/postgres.crt:/certs/postgres.crt:ro
      - ./nats-config:/nats-config
    depends_on:
      metadata-db:
        condition: service_healthy
      app-postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
      couchdb:
        condition: service_started
      valkey:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      qdrant:
        condition: service_started
      opensearch:
        condition: service_started
      hugegraph:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2
    ports:
      - "80:80"
      - "443:443"
      - "9443:9443"
      - "9444:9444"
      - "9445:9445"
      - "9446:9446"
      - "9447:9447"
      - "9448:9448"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  metadata-db-18-data:
  app-postgres-18-data:
  rustfs-data:
  couchdb-data:
  valkey-data:
  clickhouse-data:
  clickhouse-logs:
  qdrant-data:
  opensearch-data:
  hugegraph-data:
  nats-data:
  caddy-data:
  caddy-config:
